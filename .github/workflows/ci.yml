name: CI

# Testes em cada pull request (a publicação também testa antes de publicar)
on:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/nenem-lembretes/index.ts supabase/functions/nenem-calendario/index.ts supabase/functions/nenem-atalho/index.ts
        env:
          DENO_NO_PACKAGE_JSON: '1'

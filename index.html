    <!-- Tema antes do primeiro desenho (sem piscar). Mesmo cálculo de src/lib/tema.ts (tema.test.ts confere) -->
    <script>
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem('app-nenem:aparencia') || '{}') || {}; } catch (e) {}
        var modo = ['auto', 'sistema', 'claro', 'escuro'].indexOf(a.modo) >= 0 ? a.modo : 'auto';
        var cor = ['padrao', 'azul', 'verde', 'lilas', 'terracota'].indexOf(a.cor) >= 0 ? a.cor : 'padrao';
        var ambar = typeof a.ambar === 'boolean' ? a.ambar : modo === 'auto';
        var h = new Date().getHours(), tema, tom = null;
        var escuro = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if ((h >= 22 || h < 6) && ambar) tema = 'noite';
        else if (modo === 'auto') {
          if (h >= 6 && h < 12) { tema = 'claro'; tom = 'frio'; }
          else if (h >= 12 && h < 18) { tema = 'claro'; tom = 'quente'; }
          else tema = 'escuro';
        } else if (modo === 'sistema') tema = escuro ? 'escuro' : 'claro';
        else tema = modo;
        var r = document.documentElement;
        r.setAttribute('data-tema', tema);
        if (tom) r.setAttribute('data-tom', tom);
        r.setAttribute('data-cor', cor);
        r.setAttribute('data-theme', tema === 'claro' ? 'light' : 'dark');
        var fundo = { claro: '#f6f4f1', frio: '#f2f4f7', quente: '#f8f3ec', escuro: '#0e0f13', noite: '#0c0907' };
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', fundo[tom || tema]);
      })();
    </script>
